version: 1

filesystem_policy:
  include_workdir: false
  read_only: []
  read_write: []

landlock:
  compatibility: best_effort

network_policies:
  github_api_readonly:
    name: github-api-readonly
    endpoints:
      - host: api.github.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
    binaries:
      - path: /usr/bin/curl
