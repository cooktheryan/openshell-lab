version: 1

filesystem_policy:
  include_workdir: false
  read_only:
    - /usr
    - /lib64
    - /etc
    - /proc
    - /dev/urandom
    - /dev/null
    - /opt/openshell-lab
  read_write:
    - /var/www/html

landlock:
  compatibility: hard_requirement

network_policies:
  github_api_readonly:
    name: github-api-readonly
    endpoints:
      - host: api.github.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
    binaries:
      - path: /usr/bin/curl
